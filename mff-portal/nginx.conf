# Nginx de produção para o portal Angular com proxy para o backend CodeIgniter.
# BACKEND_CODEIGNITER deve apontar para a origem interna do backend PHP.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Backend administrativo CodeIgniter.
  # Precisa vir antes do fallback da SPA para /index.html.
  location = /index.php {
    proxy_pass ${BACKEND_CODEIGNITER};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  location ^~ /index.php/ {
    proxy_pass ${BACKEND_CODEIGNITER};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  # API usada pelo portal Angular.
  # /api/Webservice/listarIndividuos -> /Webservice/listarIndividuos no backend.
  location ^~ /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass ${BACKEND_CODEIGNITER};

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';

    if ($request_method = 'OPTIONS') {
      return 204;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  # Regra para o Proxy Reverso das Câmeras do museu
  # /camera-feed/<id> -> http://andromeda.lasdpc.icmc.usp.br:60119/stream/<id>
  location /camera-feed/ {
    proxy_pass http://andromeda.lasdpc.icmc.usp.br:60119/stream/;

    # Cabeçalhos
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Otimização de Stream
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 86400s;
  }

  # Fallback da SPA Angular. Rotas de backend devem ficar acima deste bloco.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
